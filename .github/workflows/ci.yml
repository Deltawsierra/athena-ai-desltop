name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (client and server)
        run: npm run check

      - name: Test
        run: npm test

      - name: Build client
        run: npm run build:client

      - name: Build server bundle
        run: npm run build:server
